services:
  - type: web
    name: respiro-2-0
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        value: '*'
      - key: GEMINI_API_KEY
        sync: false
